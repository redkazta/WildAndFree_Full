name: Flutter ERP Mobile Build

on:
  push:
    branches: [Kazta_dev_main]
    paths:
      - "apps/wild-erp-mobile/**"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  FLUTTER_VERSION: "3.44.4"
  APP_DIR: apps/wild-erp-mobile
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Clean and install dependencies
        run: |
          flutter clean
          flutter pub cache clean --force
          rm -f pubspec.lock
          flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Generate app icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build Android APK (debug)
        run: flutter build apk --debug
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.daemon.enabled=false"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wild-erp-android-debug
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-debug.apk

      - name: Build Android APK (release)
        if: github.event.inputs.create_release == 'true'
        run: flutter build apk --release
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.daemon.enabled=false"

      - name: Create Release
        if: github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "Wild Gvng ERP v${{ github.run_number }}"
          body: |
            Mobile ERP build from commit ${{ github.sha }}
          files: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
