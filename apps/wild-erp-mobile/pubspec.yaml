name: wild_erp_mobile
description: Wild Gvng Music Hub - Mobile ERP
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.0
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/wg_logo.png
    - assets/wild_and_free.jpg
    - assets/wildgvng-logo.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/wg_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/wg_logo.png"
  min_sdk_android: 21
