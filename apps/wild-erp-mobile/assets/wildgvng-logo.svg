<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280" fill="none" stroke="black" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Head outline (diamond shape) -->
  <path d="M 100 20 L 160 80 L 160 160 L 100 200 L 40 160 L 40 80 Z" fill="none" stroke="black" stroke-width="8"/>

  <!-- Left eye (closed line) -->
  <line x1="60" y1="100" x2="85" y2="110"/>

  <!-- Right eye (closed line) -->
  <line x1="115" y1="110" x2="140" y2="100"/>

  <!-- Mouth -->
  <path d="M 90 135 Q 100 145 110 135" fill="none" stroke="black" stroke-width="6"/>

  <!-- Connection line from head -->
  <line x1="100" y1="200" x2="100" y2="230"/>

  <!-- Bottom circle (moon/sun) -->
  <circle cx="100" cy="255" r="20" fill="black"/>

  <!-- Moon crescent details -->
  <circle cx="108" cy="250" r="16" fill="white" stroke="none"/>
  <circle cx="95" cy="260" r="18" fill="white" stroke="none"/>

  <!-- Decorative X on left -->
  <line x1="30" y1="235" x2="50" y2="255"/>
  <line x1="50" y1="235" x2="30" y2="255"/>

  <!-- Decorative Z on right -->
  <g stroke="black" stroke-width="7">
    <line x1="155" y1="240" x2="180" y2="240"/>
    <line x1="180" y1="240" x2="155" y2="270"/>
    <line x1="155" y1="270" x2="180" y2="270"/>
  </g>
</svg>
